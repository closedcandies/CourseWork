# nginx внутри контейнера frontend: отдаёт статику и проксирует запросы к backend.
# Снаружи к нему обращается только nginx-proxy (по сети proxy).

# Не больше 10 созданий ссылок в минуту с одного IP (короткие всплески до 5 пропускаем)
limit_req_zone $binary_remote_addr zone=create_link:10m rate=10r/m;
limit_req_status 429;

# Протокол клиента: nginx-proxy передаёт его в X-Forwarded-Proto
map $http_x_forwarded_proto $client_proto {
    default $http_x_forwarded_proto;
    ""      $scheme;
}

upstream backend {
    server backend:8000;
}

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    server_tokens off;

    # Реальный IP клиента берём из заголовка, который выставляет nginx-proxy
    set_real_ip_from 172.16.0.0/12;
    set_real_ip_from 10.0.0.0/8;
    set_real_ip_from 192.168.0.0/16;
    real_ip_header X-Forwarded-For;
    real_ip_recursive on;

    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $client_proto;

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    location = / {
        try_files /index.html =404;
    }

    location /assets/ {
        expires 1h;
    }

    location = /favicon.svg {
        expires 1d;
    }

    # Создание ссылки: с ограничением частоты запросов
    location = /api/links {
        limit_req zone=create_link burst=5 nodelay;
        proxy_pass http://backend;
    }

    # Остальное API (статистика, документация, healthcheck)
    location /api/ {
        proxy_pass http://backend;
    }

    # Короткие ссылки вида /AbC123 — перенаправление выполняет backend
    location ~ "^/[A-Za-z0-9_-]{3,32}$" {
        proxy_pass http://backend;
    }

    location / {
        return 404;
    }
}
