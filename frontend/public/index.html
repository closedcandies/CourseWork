<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Сокращатель ссылок</title>
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/assets/style.css">
</head>
<body>
  <main class="card">
    <h1>Сокращатель ссылок</h1>
    <p class="muted">Вставьте длинную ссылку и получите короткую. Переходы по ней считаются.</p>

    <form id="form" autocomplete="off">
      <label for="url">Длинная ссылка</label>
      <input id="url" name="url" type="url" placeholder="https://example.com/very/long/path" required>

      <label for="alias">Своё короткое имя <span class="muted">(необязательно)</span></label>
      <input id="alias" name="alias" type="text" placeholder="например, my-link"
             pattern="[A-Za-z0-9_\-]{3,32}" title="3–32 символа: латиница, цифры, - и _">

      <button id="submit" type="submit">Сократить</button>
    </form>

    <p id="error" class="error" hidden></p>

    <section id="result" class="result" hidden>
      <span class="muted">Короткая ссылка:</span>
      <div class="short">
        <a id="short" href="#" target="_blank" rel="noopener"></a>
        <button id="copy" type="button" class="secondary">Копировать</button>
      </div>
    </section>
  </main>

  <section class="card">
    <div class="row">
      <h2>Мои ссылки</h2>
      <button id="refresh" type="button" class="secondary">Обновить</button>
    </div>
    <p id="empty" class="muted">Здесь появятся созданные вами ссылки со счётчиком переходов.</p>
    <table id="links" hidden>
      <thead><tr><th>Короткая ссылка</th><th>Куда ведёт</th><th class="num">Переходы</th></tr></thead>
      <tbody></tbody>
    </table>
  </section>

  <footer class="muted">Курсовая работа · Docker Compose · nginx-proxy · Let's Encrypt · <a href="/api/docs">API</a></footer>

  <script src="/assets/app.js"></script>
</body>
</html>
